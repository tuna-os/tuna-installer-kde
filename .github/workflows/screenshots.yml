name: screenshots

# Builds the Kirigami/QML installer and renders every wizard step from the REAL
# QML module (only main.cpp is swapped for tests/capture.cpp), then publishes
# the walkthrough.
#
# This job runs in a Fedora container because the UI is Plasma 6 / KF6:
# Kirigami, Kirigami Addons (FormCard) and the org.kde.desktop Controls style
# are resolved at runtime from the QML import path, and Ubuntu runners have no
# KF6 packages. It is also the only thing in CI that actually starts the app —
# the previous Widgets version segfaulted on launch once, and nothing but this
# job could have caught it.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "modules/**"
      - "tests/**"
      - "CMakeLists.txt"
      - ".github/workflows/screenshots.yml"
  pull_request:
    paths:
      - "src/**"
      - "modules/**"
      - "tests/**"
      - "CMakeLists.txt"
      - ".github/workflows/screenshots.yml"
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-24.04
    container: fedora:42
    permissions:
      contents: write
    steps:
      # Runs before checkout: the fedora:42 image has no git, so
      # actions/checkout would fall back to the slower REST tarball path.
      - name: install Qt6 + KF6 runtime
        run: |
          dnf -y install --setopt=install_weak_deps=False \
            git tar findutils which \
            cmake ninja-build gcc-c++ \
            qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtsvg \
            kf6-kirigami kf6-kirigami-addons kf6-qqc2-desktop-style \
            kf6-breeze-icons dejavu-sans-fonts dejavu-sans-mono-fonts \
            ImageMagick
          echo "--- versions ---"
          rpm -q qt6-qtbase kf6-kirigami kf6-kirigami-addons kf6-qqc2-desktop-style kf6-breeze-icons

      - uses: actions/checkout@v7

      - name: build installer + capture harness
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_CAPTURE=ON
          cmake --build build -j"$(nproc)"

      # Qt's offscreen platform plugin and the software scenegraph: no X
      # server, no compositor, no GPU.
      - name: capture every screen
        env:
          XDG_RUNTIME_DIR: /tmp/runtime
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          ./build/tuna-installer-capture docs/screenshots
          rm -f docs/screenshots/.lsblk-fixture.json
          if command -v magick >/dev/null; then IM=magick; else IM=convert; fi
          $IM -delay 240 -loop 0 docs/screenshots/0*.png docs/screenshots/walkthrough.gif
          ls -l docs/screenshots

      - uses: actions/upload-artifact@v4
        # always(): the capture fails when a screen renders wrong, which is
        # exactly when the picture is needed.
        if: always()
        with:
          name: gui-screenshots
          path: docs/screenshots/

      - name: commit refreshed screenshots
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "docs: refresh GUI screenshots [skip ci]"
          git push
